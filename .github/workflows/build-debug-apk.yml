name: Build debug APK and publish prerelease

on:
  workflow_dispatch:
    inputs:
      release_title:
        description: Optional title suffix for the prerelease
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: mms-swahili-tts-releases
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build and publish prerelease
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source and LFS assets
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Java required by Gradle
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: "25"
          cache: gradle

      - name: Install and verify required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER=""
            for candidate in "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager; do
              if [[ -x "$candidate" ]]; then
                SDKMANAGER="$candidate"
                break
              fi
            done
          fi
          if [[ -z "$SDKMANAGER" ]]; then
            echo "No executable SDK Manager found under $ANDROID_HOME/cmdline-tools." >&2
            echo "Expected cmdline-tools/latest/bin/sdkmanager or a versioned equivalent." >&2
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print >&2 || true
            exit 1
          fi
          echo "Using Android SDK Manager: $SDKMANAGER"
          "$SDKMANAGER" --version
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"

      - name: Verify the LFS model asset
        shell: bash
        run: |
          set -euo pipefail
          MODEL=app/src/main/assets/mms-swh-vits.onnx
          EXPECTED_BYTES=114017796
          EXPECTED_SHA256=af4f2e2174960af06a7a7d07810ea7eb2d78fba827be7690abb230159717d250
          test "$(stat --format=%s "$MODEL")" = "$EXPECTED_BYTES"
          test "$(sha256sum "$MODEL" | awk '{print $1}')" = "$EXPECTED_SHA256"

      - name: Build and run JVM tests
        shell: bash
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Verify APK contents and capture metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          APK_SOURCE=app/build/outputs/apk/debug/app-debug.apk
          APK=dist/MmsSwahiliTtsEngine-debug.apk
          MODEL_ASSET=assets/mms-swh-vits.onnx
          EXPECTED_MODEL_SHA256=af4f2e2174960af06a7a7d07810ea7eb2d78fba827be7690abb230159717d250
          mkdir -p dist
          cp "$APK_SOURCE" "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.negi.mmsswahilitts'"
          unzip -Z1 "$APK" | grep -Fx "$MODEL_ASSET"
          unzip -p "$APK" "$MODEL_ASSET" | sha256sum | awk '{print $1}' > dist/model-asset.sha256
          test "$(cat dist/model-asset.sha256)" = "$EXPECTED_MODEL_SHA256"
          APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts)
          TAG="debug-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::12}"
          BUILD_DATE=$(date --utc +%Y-%m-%dT%H:%M:%SZ)
          printf '%s\n' "$APK_SHA256" > dist/MmsSwahiliTtsEngine-debug.apk.sha256
          {
            echo "tag=$TAG"
            echo "apk_sha256=$APK_SHA256"
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
            echo "build_date=$BUILD_DATE"
          } >> "$GITHUB_OUTPUT"

      - name: Create QR code for the release APK
        env:
          TAG: ${{ steps.metadata.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          QR_VENV="$RUNNER_TEMP/qr-venv"
          QR_ASSET=dist/MmsSwahiliTtsEngine-download-qr.png
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/MmsSwahiliTtsEngine-debug.apk"
          python3 -m venv "$QR_VENV"
          "$QR_VENV/bin/python" -m pip install --disable-pip-version-check --no-cache-dir 'qrcode[pil]==8.2'
          "$QR_VENV/bin/python" - "$DOWNLOAD_URL" "$QR_ASSET" <<'PY'
          import qrcode
          import sys
          qrcode.make(sys.argv[1]).save(sys.argv[2])
          PY
          test -s "$QR_ASSET"

      - name: Create debug prerelease and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
          TITLE_SUFFIX: ${{ inputs.release_title }}
          APK_SHA256: ${{ steps.metadata.outputs.apk_sha256 }}
          VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
          BUILD_DATE: ${{ steps.metadata.outputs.build_date }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE="MMS Swahili TTS debug ${TAG}"
          if [[ -n "$TITLE_SUFFIX" ]]; then TITLE="$TITLE — $TITLE_SUFFIX"; fi
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/MmsSwahiliTtsEngine-debug.apk"
          QR_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/MmsSwahiliTtsEngine-download-qr.png"
          cat > dist/release-notes.md <<EOF
          Debug APK built from commit ${GITHUB_SHA} at ${BUILD_DATE}.

          [Download the debug APK](${DOWNLOAD_URL})

          ![QR code for the debug APK download](${QR_URL})

          APK SHA-256: \`${APK_SHA256}\`

          Version: ${VERSION_NAME}

          This APK bundles Meta's MMS Swahili model, licensed CC BY-NC 4.0.
          It is for non-commercial use only; see the repository provenance documentation.
          EOF
          gh release create "$TAG" dist/MmsSwahiliTtsEngine-debug.apk dist/MmsSwahiliTtsEngine-debug.apk.sha256 dist/MmsSwahiliTtsEngine-download-qr.png \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "$TITLE" \
            --notes-file dist/release-notes.md
